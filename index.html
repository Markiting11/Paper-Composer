
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Composer - Handwritten to Professional Exam Papers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Times+New+Roman&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            background-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
        }

        /* System Print Styles */
        @media print {
            @page {
                size: A4;
                margin: 0;
            }
            
            #root, #root > div {
                display: block !important;
                height: auto !important;
                min-height: 0 !important;
                background: white !important;
            }

            .no-print, header, footer, main {
                display: none !important;
            }

            .print-only-container {
                display: block !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 210mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                z-index: 9999;
            }

            .a4-page {
                box-shadow: none !important;
                border: none !important;
                margin: 0 !important;
                width: 210mm !important;
                min-height: 297mm !important;
                page-break-after: auto !important;
                overflow: visible !important;
            }
        }

        .preview-scroll-container::-webkit-scrollbar {
            width: 5px;
        }
        .preview-scroll-container::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .preview-scroll-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .pdf-export-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 210mm;
            height: 0;
            overflow: hidden;
            visibility: hidden;
            pointer-events: none;
            z-index: -1000;
        }
        
        #pdf-export-content {
            visibility: visible;
            background: white;
            width: 210mm;
        }
    </style>
<script type="importmap">
